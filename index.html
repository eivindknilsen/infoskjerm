body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: var(--fs, 16px); line-height: 1.25; }

  var head = ["Veke", "Måndag", "Tysdag", "Onsdag", "Torsdag", "Fredag", "Lau. seminar", "Lau. elevkveld"].map(function (h) {
    return "<div class=\"bh\">" + h + "</div>";
  }).join("");
  $("next-title").textContent = list.length ? "Vekene som kjem" : "Ingen fleire veker i år";
  $("board").innerHTML = list.length ? head + list.map(function (w, k) {
    var last = k === list.length - 1 ? " last" : "";
    return "<div class=\"bw" + last + "\"><div class=\"wn\">" + w.w + "</div><div class=\"dt\">" + range(w.mon) + "</div>" + (w.plan ? "<div class=\"pl\">" + esc(w.plan) + "</div>" : "") + "</div>" + spans(w.days).map(function (s) {
      return "<div class=\"bc" + last + "\" style=\"grid-column:span " + s.n + "\">" + (s.t ? "<div class=\"c " + (s.n > 1 ? "span " : "") + "k-" + s.k + "\">" + esc(s.t) + "</div>" : "") + "</div>";
    }).join("");
  }).join("") : "";
}
function duty(now) {
  var d = startOfDay(now),
    ts = TS[iso(d)] || {},
    wk = d.getDay() === 0 || d.getDay() === 6;
  var row = function row(lbl, time, v) {
    return "<div><small>" + lbl + (time ? "<i>" + time + "</i>" : "") + "</small>" + (v ? "<b>" + esc(v) + "</b>" : "<b class=\"no\">\u2013</b>") + "</div>";
  };
  $("duty").innerHTML = row("Ord for dagen", "", ts.o) + row("Tilsyn", wk ? "08.30–22.30" : "15.30–22.30", ts.t) + row("Nattevakt", "22.30–08.30", ts.n);
}

// Modular som går denne veka eller dei næraste vekene, med dagane dei går.
function mods(now, idx) {
  var today = startOfDay(now),
    found = {},
    order = [];
  WEEKS.slice(Math.max(idx, 0), idx + 1 + MODS_AHEAD).forEach(function (w) {
    return w.days.slice(0, 5).forEach(function (d, i) {
      return groupsFor(w, d).forEach(function (k) {
        var date = addDays(parse(w.mon), i);
        if (date < today) return;
        if (!found[k]) {
          found[k] = [];
          order.push(k);
        }
        found[k].push({
          w: w,
          i: i,
          date: date
        });
      });
    });
  });
  order.splice(MODS_MAX);
  var panel = $("mods-panel");
  panel.hidden = !order.length;
  $("mods").innerHTML = order.map(function (k) {
    var g = VF[k],
      hits = found[k];
    var isNow = hits.some(function (h) {
      return WEEKS.indexOf(h.w) === idx;
    });
    var byWeek = [];
    hits.forEach(function (h) {
      var last = byWeek[byWeek.length - 1];
      if (last && last.w === h.w) last.is.push(h.i);else byWeek.push({
        w: h.w,
        is: [h.i]
      });
    });
    var when = byWeek.map(function (b) {
      var is = b.is,
        run = is.length > 1 && is[is.length - 1] - is[0] === is.length - 1;
      return "veke " + b.w.w + ": " + (run ? DSHORT[is[0]] + "–" + DSHORT[is[is.length - 1]] : is.map(function (i) {
        return DSHORT[i];
      }).join(", "));
    }).join(" · ");
    var subs = g.subs.map(function (s) {
      var who = s.l.map(function (x) {
        return NAMES[x] || x;
      }).join(" og ") || "Lærar ikkje sett";
      return "<li><span class=\"f" + (s.f ? "" : " tbd") + "\">" + (s.f ? esc(s.f) : "Fag ikkje sett") + "</span><span class=\"l\">" + esc(who) + "</span></li>";
    }).join("");
    return "<section class=\"mod" + (g.pv ? " pv" : "") + "\"><div class=\"mod-head\"><h3>" + esc(g.title) + (isNow ? "<span class=\"now\">Denne veka</span>" : "") + "</h3>" + ("<div class=\"when\">" + esc(when[0].toUpperCase() + when.slice(1)) + "</div></div><ul class=\"fag\">" + subs + "</ul></section>");
  }).join("");
}
function tick() {
  var now = new Date();
  $("clock-t").textContent = now.toLocaleTimeString("nn-NO", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
  var d = DAYL[now.getDay()];
  $("clock-d").textContent = d[0].toUpperCase() + d.slice(1) + " " + now.getDate() + ". " + MON[now.getMonth()] + " " + now.getFullYear();
}
var lastDay = "";
var render = function render() {
  var now = new Date(),
    _currentIdx = currentIdx(now),
    idx = _currentIdx.idx,
    label = _currentIdx.label;
  tick();
  hero(now, idx, label);
  board(idx);
  duty(now);
  mods(now, idx);
  lastDay = now.toDateString();
};
// Skaler skrifta så heile innhaldet får plass på skjermen utan scrolling.
function fit() {
  var root = document.documentElement,
    scr = $("screen");
  var fs = Math.max(11, Math.min(32, innerWidth / 90));
  root.style.setProperty("--fs", fs + "px");
  while (scr.scrollHeight > innerHeight && fs > 7) {
    fs -= 0.25;
    root.style.setProperty("--fs", fs + "px");
  }
}
var _render = render;
render = function render() {
  _render();
  fit();
};
render();
addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
// Klokka går kvart 15. sekund; ved ny dag blir heile skjermen teikna på nytt.
setInterval(function () {
  new Date().toDateString() === lastDay ? tick() : render();
}, 15000);
// Hald skjermen vaken der nettlesaren tillèt det.
function wake() {
  try {
    if (document.visibilityState === "visible" && navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {});
  } catch (e) {}
}
wake();
document.addEventListener("visibilitychange", wake);
// Last sida på nytt kvar time, slik at nye versjonar på GitHub kjem fram av seg sjølv.
// Sjekkar først at sida er tilgjengeleg, så skjermen ikkje blir blank om nettet er nede.
setInterval(function () {
  try {
    var x = new XMLHttpRequest();
    x.open("GET", location.href.split("#")[0] + (location.search ? "&" : "?") + "_=" + Date.now());
    x.onload = function () {
      if (x.status >= 200 && x.status < 400) location.reload();
    };
    x.send();
  } catch (e) {}
}, 60 * 60 * 1000);
</script>
